version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retinascope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-retinascope}
    ports:
      - "5432:5432"
    volumes:
      - retinascope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retinascope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  retinascope_pgdata:
    driver: local
